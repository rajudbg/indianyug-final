# Cloudflare Pages Configuration for Performance

name = "indianyug-frontend"
compatibility_date = "2024-01-01"

[build]
command = "npm run pages:build"
destination = ".vercel/output/static"

# Environment variables for build optimization
[env.production]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
NODE_OPTIONS = "--max-old-space-size=4096"

# Performance optimizations
[functions]
node_compat = true

# Cache settings for Cloudflare Pages
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Static assets caching
[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.{js,css,woff,woff2,ttf,eot,ico}"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.{jpg,jpeg,png,webp,avif,gif,svg}"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# HTML caching
[[headers]]
for = "*.html"
[headers.values]
Cache-Control = "public, max-age=3600"

# API routes
[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "public, s-maxage=300, stale-while-revalidate=86400"
